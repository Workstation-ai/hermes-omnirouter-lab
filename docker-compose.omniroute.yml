services:
  omniroute:
    image: diegosouzapw/omniroute:3.8.49
    ports:
      - "127.0.0.1:20128:20128"
      - "127.0.0.1:20129:20129"
    environment:
      - OMNIROUTE_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:20128/v1/models"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped
