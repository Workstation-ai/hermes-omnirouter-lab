services:
  omniroute:
    image: diegosouzapw/omniroute:3.8.49
    network_mode: host
    environment:
      - OMNIROUTE_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:20128/v1/models"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped
